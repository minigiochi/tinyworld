name: Keep-alive Render
# Ogni 10 minuti contatta il server del mondo sempre attivo, così Render (piano gratuito) non lo mette in pausa.
# Imposta l'indirizzo in: Settings > Secrets and variables > Actions > Variables > RENDER_URL
# (esempio: https://tinyworld.onrender.com). Se la variabile manca, il lavoro non fa nulla.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz
        env:
          URL: ${{ vars.RENDER_URL }}
        run: |
          if [ -z "$URL" ]; then echo "RENDER_URL non impostata: niente da fare"; exit 0; fi
          curl -fsS --retry 3 --retry-delay 10 --max-time 90 "${URL%/}/healthz"; echo
